<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Бункер — раздача карточек</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bunker-bg bunker-theme">
  <main class="app-shell app-shell-game">
    <div class="topbar compact-topbar">
      <a class="brand back-brand" href="index.html">← Выбор игры</a>
      <div class="button-row">
        <button class="ghost-btn" id="restoreBtn">Вернуть раздачу</button>
        <button class="danger-btn" id="resetBtn">Сбросить</button>
      </div>
    </div>

    <section id="setupView" class="setup-card single-setup-card themed-frame bunker-frame">
      <div class="section-title-wrap">
        <div class="section-kicker">Бункер</div>
        <h1>Раздача карточек</h1>
      </div>
      <div class="field-grid bunker-grid">
        <div class="field">
          <label for="playerCount">Игроков</label>
          <input id="playerCount" type="number" min="4" max="30" value="10">
        </div>
        <div class="field">
          <label for="revealMode">Режим</label>
          <select id="revealMode">
            <option value="private">Сначала сценарий, потом по игрокам</option>
            <option value="moderator">Сразу экран ведущего</option>
          </select>
        </div>
      </div>
      <div class="button-row major-actions">
        <button class="primary-btn bunker-primary" id="startBunkerBtn">Сгенерировать сценарий</button>
      </div>
      <div class="compact-summary compact-summary-bunker">
        <div class="summary-pill"><span>Игроков</span><strong id="playersKpi">10</strong></div>
        <div class="summary-pill"><span>Катастрофа</span><strong id="scenarioKpi">1</strong></div>
        <div class="summary-pill"><span>Бункер</span><strong id="bunkerKpi">1</strong></div>
        <div class="summary-pill"><span>Карты</span><strong id="cardsKpi">10</strong></div>
      </div>
      <p class="muted centered-muted" id="bunkerHint">Лучше всего работает с 8–16 игроками.</p>
    </section>

    <section id="scenarioView" class="reveal-card hidden full-reveal-card bunker-reveal-frame">
      <div class="scenario-card cinematic-scenario-card">
        <div class="role-stage-badge bunker-badge">Сценарий катастрофы</div>
        <h2 id="scenarioTitle"></h2>
        <p class="scenario-main-text" id="scenarioDesc"></p>
        <div class="scenario-pills" id="scenarioPills"></div>
        <div class="button-row centered-row"><button class="primary-btn bunker-primary reveal-main-btn" id="beginDealBtn">Начать раздачу карт</button></div>
      </div>
    </section>

    <section id="revealView" class="reveal-card hidden full-reveal-card bunker-reveal-frame">
      <div class="reveal-stage active" id="revealWaiting">
        <div class="reveal-center reveal-center-wide">
          <div class="role-stage-badge bunker-badge">Личная карточка</div>
          <div class="deal-counter" id="dealCounter">Игрок 1 из 10</div>
          <h2 id="revealPlayerTitle">Игрок 1</h2>
          <button class="primary-btn bunker-primary reveal-main-btn" id="showCharacterBtn">Открыть карту</button>
        </div>
      </div>
      <div class="reveal-stage" id="revealCardStage">
        <div class="deck-card bunker-deck-card" id="characterRevealBody"></div>
        <div class="button-row centered-row" style="margin-top:16px">
          <button class="ghost-btn accent-ghost" id="hideCharacterBtn">Скрыть карту</button>
        </div>
      </div>
    </section>

    <section id="dashboardView" class="dashboard-grid hidden">
      <div class="dashboard-card themed-frame bunker-frame">
        <div class="topbar" style="margin-bottom:14px">
          <h3 style="margin:0">Экран ведущего</h3>
          <div class="button-row"><button class="ghost-btn accent-ghost" id="showAllBtn">Показать карточки</button></div>
        </div>
        <div class="modal-grid" id="scenarioGrid"></div>
      </div>
      <div class="players-grid" id="playersGrid"></div>
    </section>
  </main>

  <div class="modal" id="playerModal">
    <div class="modal-card modal-card-wide themed-frame bunker-frame">
      <div class="topbar"><h2 id="modalTitle" style="margin:0">Игрок</h2><button class="ghost-btn" id="closeModalBtn">Закрыть</button></div>
      <div class="segmented" id="modalTabs">
        <button class="seg-btn active" data-tab="core">Основа</button>
        <button class="seg-btn" data-tab="traits">Черты</button>
        <button class="seg-btn" data-tab="secret">Секрет</button>
      </div>
      <div class="modal-grid" id="modalBody"></div>
    </div>
  </div>

    let state = null;

    const el = id => document.getElementById(id);
    function clampNumber(value,min,max,fallback){ const num=parseInt(value,10); if(Number.isNaN(num)) return fallback; return Math.min(max, Math.max(min,num)); }
    function updateSetupPreview(){ const players=clampNumber(el('playerCount').value,4,30,10); el('playersKpi').textContent=players; el('cardsKpi').textContent=players; el('scenarioKpi').textContent=1; el('bunkerKpi').textContent=1; el('bunkerHint').textContent=players<6?'Для яркой партии лучше 6+ игроков.':'Хороший размер группы для раздачи.'; }
    function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    function clearState(){ localStorage.removeItem(STORAGE_KEY); }
    function randomFrom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
    function randomUniqueMultiple(arr,min,max){ const copy=[...arr]; const count=Math.min(copy.length, Math.floor(Math.random()*(max-min+1))+min); const result=[]; for(let i=0;i<count;i++){ const idx=Math.floor(Math.random()*copy.length); result.push(copy.splice(idx,1)[0]); } return result; }
    function generateCharacters(fields,total){ const used={ professions:new Set(), health:new Set(), phobias:new Set(), skills:new Set(), inventory:new Set(), qualities:new Set(), biography:new Set(), secrets:new Set() }; function pick(key){ const pool=fields[key]; const available=pool.filter(item=>!used[key].has(item)); const value=available.length?randomFrom(available):randomFrom(pool); used[key].add(value); return value; } return Array.from({length:total}, (_,i)=>({ id:i+1, profession:pick('professions'), health:pick('health'), phobia:pick('phobias'), skill:pick('skills'), inventory:pick('inventory'), quality:pick('qualities'), biography:pick('biography'), secret:pick('secrets') })); }
    function startBunker(){ const players=clampNumber(el('playerCount').value,4,30,10); const disaster=randomFrom(bunkerData.disasters); const setting=randomFrom(bunkerData.settings); const supplies=randomUniqueMultiple(bunkerData.supplies,2,4); const area=randomFrom(['56 м², один уровень','92 м², комфортный блок','128 м², два уровня','168 м², секции и склады','220 м², модульный комплекс']); const specialRule=randomFrom(['Запас воздуха нестабилен.','Одна секция бункера запечатана.','В первые недели нельзя выходить наружу.','Ресурсы ограничены, но есть шанс на автономию.','Снаружи слышен слабый радиосигнал.']); state={ phase:'scenario', revealIndex:0, showAllCards:false, config:{ players, revealMode:el('revealMode').value }, scenario:{ disaster, setting, supplies, area, specialRule }, players:generateCharacters(bunkerData.fields, players) }; saveState(); if(state.config.revealMode==='private') showScenario(); else showDashboard(); }
    function showScenario(){ el('setupView').classList.add('hidden'); el('revealView').classList.add('hidden'); el('dashboardView').classList.add('hidden'); el('scenarioView').classList.remove('hidden'); const s=state.scenario; el('scenarioTitle').textContent=s.disaster.type; el('scenarioDesc').textContent=s.disaster.description; el('scenarioPills').innerHTML=`<span class="scenario-pill">Бункер: ${s.area}</span><span class="scenario-pill">Срок: ${s.setting.duration}</span><span class="scenario-pill">Размер: ${s.setting.size}</span><span class="scenario-pill">Ресурсы: ${s.setting.resources}</span><span class="scenario-pill">Припасы: ${s.supplies.join(', ')}</span><span class="scenario-pill special">${s.specialRule}</span>`; state.phase='scenario'; saveState(); }
    function beginDeal(){ state.phase='reveal'; saveState(); showReveal(); }
    function showReveal(){ el('setupView').classList.add('hidden'); el('scenarioView').classList.add('hidden'); el('dashboardView').classList.add('hidden'); el('revealView').classList.remove('hidden'); renderReveal(); }
    function renderReveal(){ const player=state.players[state.revealIndex]; if(!player){ showDashboard(); return; } el('revealWaiting').classList.add('active'); el('revealCardStage').classList.remove('active'); el('revealPlayerTitle').textContent=`Игрок ${player.id}`; el('dealCounter').textContent=`Игрок ${player.id} из ${state.players.length}`; }
    function chunkCard(player,tab='core'){ const groups={ core:[['Профессия',player.profession],['Здоровье',player.health],['Биография',player.biography]], traits:[['Фобия',player.phobia],['Навык',player.skill],['Качество',player.quality],['Инвентарь',player.inventory]], secret:[['Секрет',player.secret]] }; const tabs=`<div class="segmented reveal-tabs"><button class="seg-btn ${tab==='core'?'active':''}" data-tab="core">Основа</button><button class="seg-btn ${tab==='traits'?'active':''}" data-tab="traits">Черты</button><button class="seg-btn ${tab==='secret'?'active':''}" data-tab="secret">Секрет</button></div>`; const cards=groups[tab].map(([label,val])=>`<div class="stat-card compact-stat"><div class="stat-label">${label}</div><div class="stat-value">${val}</div></div>`).join(''); return `<div class="deck-head"><div><div class="section-kicker">Карточка игрока</div><h3>Игрок ${player.id}</h3></div><div class="survival-seal"></div></div>${tabs}<div class="deck-grid deck-grid-compact">${cards}</div>`; }
    function showCharacter(tab='core'){ const player=state.players[state.revealIndex]; if(!player) return; el('characterRevealBody').innerHTML=chunkCard(player,tab); attachRevealTabs(); el('revealWaiting').classList.remove('active'); el('revealCardStage').classList.add('active'); }
    function attachRevealTabs(){ document.querySelectorAll('#characterRevealBody .seg-btn').forEach(btn=>btn.addEventListener('click', ()=>showCharacter(btn.dataset.tab))); }
    function hideCharacterAndNext(){ state.revealIndex += 1; saveState(); renderReveal(); }
    function showDashboard(){ el('setupView').classList.add('hidden'); el('scenarioView').classList.add('hidden'); el('revealView').classList.add('hidden'); el('dashboardView').classList.remove('hidden'); renderDashboard(); }
    function renderDashboard(){ if(!state) return; const s=state.scenario; el('showAllBtn').textContent=state.showAllCards?'Скрыть карточки':'Показать карточки'; el('scenarioGrid').innerHTML=`<div class="kpi"><div class="label">Катастрофа</div><div class="value" style="font-size:24px">${s.disaster.type}</div><div class="hint">${s.disaster.description}</div></div><div class="kpi"><div class="label">Бункер</div><div class="value" style="font-size:24px">${s.area}</div><div class="hint">Срок: ${s.setting.duration}</div></div><div class="kpi"><div class="label">Ресурсы</div><div>${s.setting.resources}</div><div class="hint">Размер: ${s.setting.size}</div></div><div class="kpi"><div class="label">Припасы</div><div>${s.supplies.join(', ')}</div><div class="hint">Стартовый запас</div></div><div class="kpi" style="grid-column:1 / -1"><div class="label">Особое правило</div><div>${s.specialRule}</div></div>`; el('playersGrid').innerHTML=state.players.map(player=>`<article class="player-card themed-frame bunker-mini-card ${state.showAllCards?'':'dead'}"><div class="title-row"><div><h4>Игрок ${player.id}</h4><div class="muted">${state.showAllCards?player.profession:'Карточка скрыта'}</div></div><span class="status-badge ${state.showAllCards?'good':'warn'}">${state.showAllCards?'Открыто':'Секретно'}</span></div><div class="tag-row"><span class="tag">Навык: ${state.showAllCards?player.skill:'скрыт'}</span><span class="tag">Качество: ${state.showAllCards?player.quality:'скрыто'}</span></div><div class="button-row" style="margin-top:12px"><button class="soft-btn" onclick="openPlayerModal(${player.id})">Подробнее</button></div></article>`).join(''); saveState(); }
    function openPlayerModal(id){ modalPlayer=state.players.find(player=>player.id===id); if(!modalPlayer) return; el('modalTitle').textContent=`Игрок ${modalPlayer.id}`; renderModalTab('core'); el('playerModal').classList.add('active'); }
    function renderModalTab(tab){ if(!modalPlayer) return; document.querySelectorAll('#modalTabs .seg-btn').forEach(btn=>btn.classList.toggle('active', btn.dataset.tab===tab)); const groups={ core:[['Профессия',modalPlayer.profession],['Здоровье',modalPlayer.health],['Биография',modalPlayer.biography]], traits:[['Фобия',modalPlayer.phobia],['Навык',modalPlayer.skill],['Качество',modalPlayer.quality],['Инвентарь',modalPlayer.inventory]], secret:[['Секрет',modalPlayer.secret]] }; el('modalBody').innerHTML=groups[tab].map(([label,val])=>`<div class="kpi"><div class="label">${label}</div><div>${val}</div></div>`).join(''); }
    function closeModal(){ el('playerModal').classList.remove('active'); }
    function restoreSession(){ const raw=localStorage.getItem(STORAGE_KEY); if(!raw){ alert('Сохранённая раздача не найдена.'); return; } state=JSON.parse(raw); if(state.config.revealMode!=='private') showDashboard(); else if(state.phase==='scenario') showScenario(); else if(state.revealIndex < state.players.length) showReveal(); else showDashboard(); }
    function hardReset(){ if(!confirm('Полностью сбросить текущую раздачу?')) return; state=null; clearState(); location.reload(); }
    ['playerCount','revealMode'].forEach(id=>{ el(id).addEventListener('input', updateSetupPreview); el(id).addEventListener('change', updateSetupPreview); });
    el('startBunkerBtn').addEventListener('click', startBunker); el('beginDealBtn').addEventListener('click', beginDeal); el('showCharacterBtn').addEventListener('click', ()=>showCharacter('core')); el('hideCharacterBtn').addEventListener('click', hideCharacterAndNext); el('showAllBtn').addEventListener('click', ()=>{ state.showAllCards=!state.showAllCards; renderDashboard(); }); el('closeModalBtn').addEventListener('click', closeModal); el('playerModal').addEventListener('click', e=>{ if(e.target===el('playerModal')) closeModal(); }); el('restoreBtn').addEventListener('click', restoreSession); el('resetBtn').addEventListener('click', hardReset); document.querySelectorAll('#modalTabs .seg-btn').forEach(btn=>btn.addEventListener('click', ()=>renderModalTab(btn.dataset.tab)));
    updateSetupPreview();
  </script>
