<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мафия — раздача ролей</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="mafia-bg mafia-theme">
  <main class="app-shell app-shell-game">
    <div class="topbar compact-topbar">
      <a class="brand back-brand" href="index.html">← Выбор игры</a>
      <div class="button-row">
        <button class="ghost-btn" id="restoreBtn">Вернуть раздачу</button>
        <button class="danger-btn" id="resetBtn">Сбросить</button>
      </div>
    </div>

    <section id="setupView" class="setup-card single-setup-card themed-frame mafia-frame">
      <div class="section-title-wrap">
        <div class="section-kicker">Мафия</div>
        <h1>Раздача ролей</h1>
      </div>
      <div class="field-grid mafia-grid">
        <div class="field">
          <label for="totalPlayers">Всего игроков</label>
          <input id="totalPlayers" type="number" min="5" max="30" value="10">
        </div>
        <div class="field">
          <label for="preset">Шаблон</label>
          <select id="preset">
            <option value="custom">Своя настройка</option>
            <option value="classic">Классика</option>
            <option value="party">Шумная партия</option>
            <option value="tense">Напряжённая партия</option>
          </select>
        </div>
        <div class="field"><label for="mafiaCount">Мафия</label><input id="mafiaCount" type="number" min="1" max="10" value="2"></div>
        <div class="field"><label for="sheriffCount">Комиссар</label><input id="sheriffCount" type="number" min="0" max="3" value="1"></div>
        <div class="field"><label for="doctorCount">Доктор</label><input id="doctorCount" type="number" min="0" max="3" value="1"></div>
        <div class="field"><label for="maniacCount">Маньяк</label><input id="maniacCount" type="number" min="0" max="2" value="1"></div>
      </div>
      <div class="button-row major-actions">
        <button class="primary-btn mafia-primary" id="startGameBtn">Раздать роли</button>
        <button class="ghost-btn accent-ghost" id="autoBalanceBtn">Автобаланс</button>
      </div>
      <div class="compact-summary compact-summary-mafia">
        <div class="summary-pill"><span>Игроков</span><strong id="kpiPlayers">10</strong></div>
        <div class="summary-pill"><span>Тьма</span><strong id="kpiHostile">3</strong></div>
        <div class="summary-pill"><span>Город</span><strong id="kpiCivil">7</strong></div>
        <div class="summary-pill"><span>Баланс</span><strong id="kpiBalance">OK</strong></div>
      </div>
      <p class="muted centered-muted" id="validationText">Подберите состав ролей или используйте автобаланс.</p>
    </section>

    <section id="revealView" class="reveal-card hidden full-reveal-card mafia-reveal-frame">
      <div class="reveal-stage active" id="revealWaiting">
        <div class="reveal-center reveal-center-wide">
          <div class="role-stage-badge mafia-badge">Секретная роль</div>
          <div class="deal-counter" id="dealCounter">Игрок 1 из 10</div>
          <h2 id="revealPlayerTitle">Игрок 1</h2>
          <button class="primary-btn mafia-primary reveal-main-btn" id="showRoleBtn">Открыть карту</button>
        </div>
      </div>
      <div class="reveal-stage" id="revealRoleStage">
        <div class="role-card role-card-mafia" id="mafiaRoleCard">
          <div class="role-card-top">
            <span class="status-badge bad" id="teamBadge">Роль</span>
            <div class="card-moon"></div>
          </div>
          <div class="role-card-center">
            <div class="role-name-large" id="revealRoleName">Мирный житель</div>
            <p class="reveal-desc role-desc-large" id="revealRoleDesc"></p>
          </div>
          <div class="button-row centered-row">
            <button class="ghost-btn accent-ghost" id="hideRoleBtn">Скрыть карту</button>
          </div>
        </div>
      </div>
    </section>

    <section id="dashboardView" class="dashboard-grid hidden">
      <div class="dashboard-card themed-frame mafia-frame">
        <div class="topbar" style="margin-bottom:14px">
          <h3 style="margin:0">Экран ведущего</h3>
          <div class="button-row"><button class="ghost-btn accent-ghost" id="showAllRolesBtn">Показать роли</button></div>
        </div>
        <div class="compact-summary compact-summary-mafia">
          <div class="summary-pill"><span>Игроков</span><strong id="dashPlayers">0</strong></div>
          <div class="summary-pill"><span>Мафия</span><strong id="dashMafia">0</strong></div>
          <div class="summary-pill"><span>Город</span><strong id="dashCity">0</strong></div>
          <div class="summary-pill"><span>Маньяк</span><strong id="dashSolo">0</strong></div>
        </div>
      </div>
      <div class="players-grid" id="playersGrid"></div>
    </section>
  </main>

  <div class="modal" id="playerModal">
    <div class="modal-card modal-card-wide themed-frame mafia-frame">
      <div class="topbar"><h2 id="modalTitle" style="margin:0">Игрок</h2><button class="ghost-btn" id="closeModalBtn">Закрыть</button></div>
      <div class="modal-grid" id="modalBody"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'mafiaCardDealerStateV4';
    const roleMeta = {
      'мафия': { team: 'Тьма', desc: 'Действует скрытно и играет против города.' },
      'комиссар': { team: 'Город', desc: 'Ищет тёмные роли и помогает городу.' },
      'доктор': { team: 'Город', desc: 'Поддерживает город и спасает ключевых игроков.' },
      'маньяк': { team: 'Одиночка', desc: 'Опасен для всех и играет только за себя.' },
      'мирный житель': { team: 'Город', desc: 'Наблюдает, обсуждает и ищет мафию.' }
    };
    let state = null;
    const el = id => document.getElementById(id);
    function shuffle(arr){ const copy=[...arr]; for(let i=copy.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [copy[i],copy[j]]=[copy[j],copy[i]];} return copy; }
    function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    function clearState(){ localStorage.removeItem(STORAGE_KEY); }
    function capitalize(v){ return v.charAt(0).toUpperCase()+v.slice(1); }
    function clampNumber(value,min,max,fallback){ const num=parseInt(value,10); if(Number.isNaN(num)) return fallback; return Math.min(max, Math.max(min,num)); }
    function applyPreset(){
      const total = clampNumber(el('totalPlayers').value,5,30,10);
      const preset = el('preset').value;
      let config;
      if (preset === 'classic') config = { mafia: Math.max(2, Math.round(total / 4)), sheriff: 1, doctor: 1, maniac: 0 };
      else if (preset === 'party') config = { mafia: Math.max(2, Math.round(total / 3.8)), sheriff: 1, doctor: 1, maniac: 1 };
      else if (preset === 'tense') config = { mafia: Math.max(2, Math.round(total / 3.2)), sheriff: 1, doctor: 0, maniac: 1 };
      else return;
      el('mafiaCount').value = config.mafia; el('sheriffCount').value = config.sheriff; el('doctorCount').value = config.doctor; el('maniacCount').value = config.maniac; updateSetupPreview();
    }
    function getSetupState(){
      return {
        total: clampNumber(el('totalPlayers').value,5,30,10),
        mafia: clampNumber(el('mafiaCount').value,1,10,2),
        sheriff: clampNumber(el('sheriffCount').value,0,3,1),
        doctor: clampNumber(el('doctorCount').value,0,3,1),
        maniac: clampNumber(el('maniacCount').value,0,2,1)
      };
    }
    function validateSetup(config){
      const special = config.mafia + config.sheriff + config.doctor + config.maniac;
      const civilians = config.total - special;
      if (civilians < 1) return { ok:false, text:'Нужен хотя бы один мирный житель.' };
      if (config.mafia >= civilians + config.sheriff + config.doctor) return { ok:false, text:'Слишком много тёмных ролей.' };
      const threat = config.mafia + config.maniac;
      if (threat > Math.ceil(config.total / 2)) return { ok:false, text:'Партия будет слишком жёсткой.' };
      return { ok:true, text: threat <= Math.ceil(config.total / 3) ? 'Состав выглядит сбалансированно.' : 'Состав напряжённый, но допустимый.' };
    }
    function updateSetupPreview(){
      const config = getSetupState();
      const civilians = config.total - (config.mafia + config.sheriff + config.doctor + config.maniac);
      const validation = validateSetup(config);
      el('kpiPlayers').textContent = config.total; el('kpiHostile').textContent = config.mafia + config.maniac; el('kpiCivil').textContent = civilians; el('kpiBalance').textContent = validation.ok ? 'OK' : 'ERR'; el('validationText').textContent = validation.text;
    }
    function autoBalance(){ const total=clampNumber(el('totalPlayers').value,5,30,10); el('mafiaCount').value=Math.max(2, Math.round(total/4)); el('sheriffCount').value=1; el('doctorCount').value=total>=7?1:0; el('maniacCount').value=total>=9?1:0; updateSetupPreview(); }
    function startGame(){
      const config=getSetupState(); const validation=validateSetup(config); if(!validation.ok){ alert(validation.text); return; }
      const civilians = config.total - (config.mafia + config.sheriff + config.doctor + config.maniac);
      const roles = shuffle([
        ...Array.from({length:config.mafia},()=> 'мафия'),
        ...Array.from({length:config.sheriff},()=> 'комиссар'),
        ...Array.from({length:config.doctor},()=> 'доктор'),
        ...Array.from({length:config.maniac},()=> 'маньяк'),
        ...Array.from({length:civilians},()=> 'мирный житель')
      ]);
      state = { config, revealIndex:0, showAllRoles:false, players:roles.map((role,index)=>({ id:index+1, role, team:roleMeta[role].team, desc:roleMeta[role].desc })) };
      saveState(); showReveal();
    }
    function showReveal(){ el('setupView').classList.add('hidden'); el('dashboardView').classList.add('hidden'); el('revealView').classList.remove('hidden'); renderReveal(); }
    function renderReveal(){ const player=state.players[state.revealIndex]; if(!player){ showDashboard(); return; } el('revealWaiting').classList.add('active'); el('revealRoleStage').classList.remove('active'); el('revealPlayerTitle').textContent=`Игрок ${player.id}`; el('dealCounter').textContent=`Игрок ${player.id} из ${state.players.length}`; }
    function showRole(){ const player=state.players[state.revealIndex]; if(!player) return; el('teamBadge').textContent=player.team; el('teamBadge').className=`status-badge ${player.team==='Город'?'good':player.team==='Одиночка'?'warn':'bad'}`; el('revealRoleName').textContent=capitalize(player.role); el('revealRoleDesc').textContent=player.desc; el('revealWaiting').classList.remove('active'); el('revealRoleStage').classList.add('active'); }
    function hideRoleAndNext(){ state.revealIndex += 1; saveState(); renderReveal(); }
    function showDashboard(){ el('setupView').classList.add('hidden'); el('revealView').classList.add('hidden'); el('dashboardView').classList.remove('hidden'); renderDashboard(); }
    function renderDashboard(){ if(!state) return; const mafiaCount=state.players.filter(p=>p.role==='мафия').length; const cityCount=state.players.filter(p=>p.team==='Город').length; const soloCount=state.players.filter(p=>p.team==='Одиночка').length; el('dashPlayers').textContent=state.players.length; el('dashMafia').textContent=mafiaCount; el('dashCity').textContent=cityCount; el('dashSolo').textContent=soloCount; el('showAllRolesBtn').textContent=state.showAllRoles?'Скрыть роли':'Показать роли'; el('playersGrid').innerHTML=state.players.map(player=>`<article class="player-card themed-frame mafia-mini-card ${state.showAllRoles?'':'dead'}"><div class="title-row"><div><h4>Игрок ${player.id}</h4><div class="muted">${state.showAllRoles?capitalize(player.role):'Роль скрыта'}</div></div><span class="status-badge ${player.team==='Город'?'good':player.team==='Одиночка'?'warn':'bad'}">${state.showAllRoles?player.team:'Секрет'}</span></div><div class="tag-row"><span class="tag">${state.showAllRoles?player.desc:'Откройте роли для просмотра'}</span></div><div class="button-row" style="margin-top:12px"><button class="soft-btn" onclick="openPlayerModal(${player.id})">Подробнее</button></div></article>`).join(''); saveState(); }
    function openPlayerModal(id){ const player=state.players.find(p=>p.id===id); if(!player) return; el('modalTitle').textContent=`Игрок ${player.id}`; el('modalBody').innerHTML=`<div class="kpi"><div class="label">Роль</div><div class="value">${capitalize(player.role)}</div><div class="hint">${player.team}</div></div><div class="kpi"><div class="label">Описание</div><div>${player.desc}</div></div>`; el('playerModal').classList.add('active'); }
    function closeModal(){ el('playerModal').classList.remove('active'); }
    function restoreSession(){ const raw=localStorage.getItem(STORAGE_KEY); if(!raw){ alert('Сохранённая раздача не найдена.'); return; } state=JSON.parse(raw); if(state.revealIndex < state.players.length) showReveal(); else showDashboard(); }
    function hardReset(){ if(!confirm('Полностью сбросить текущую раздачу?')) return; state=null; clearState(); location.reload(); }
    ['totalPlayers','mafiaCount','sheriffCount','doctorCount','maniacCount'].forEach(id=>{ el(id).addEventListener('input', updateSetupPreview); el(id).addEventListener('change', updateSetupPreview); });
    el('preset').addEventListener('change', applyPreset); el('startGameBtn').addEventListener('click', startGame); el('autoBalanceBtn').addEventListener('click', autoBalance); el('showRoleBtn').addEventListener('click', showRole); el('hideRoleBtn').addEventListener('click', hideRoleAndNext); el('showAllRolesBtn').addEventListener('click', ()=>{ state.showAllRoles=!state.showAllRoles; renderDashboard(); }); el('closeModalBtn').addEventListener('click', closeModal); el('playerModal').addEventListener('click', e=>{ if(e.target===el('playerModal')) closeModal(); }); el('restoreBtn').addEventListener('click', restoreSession); el('resetBtn').addEventListener('click', hardReset);
    updateSetupPreview();
  </script>
</body>
</html>
